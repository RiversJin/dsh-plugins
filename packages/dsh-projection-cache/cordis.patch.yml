# Replace the stock all-projection JSON cache with the policy-aware service.
# Heavy Context UI projections remain live and rebuild from the authoritative
# session log on cold open, but are not copied into every fork's cache row.
- id: session-projection-cache
  disabled: true

- insert:
    - id: dsh-projection-cache
      name: dsh-projection-cache
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000
        excludeKeys:
          - contextHeaders
          - contextTimeline
